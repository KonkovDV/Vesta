name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the engines floor; 26 becomes Active LTS on 2026-10-28.
        node: [24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Lifecycle scripts of dependencies do not run in CI (supply-chain hardening);
      # native modules are not needed by the unit tests.
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Public import surface
        run: |
          node -e "const k=require('./dist/kernel.js'); if (typeof k.runKernel!=='function') process.exit(1)"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  integration:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run build
      - name: Migrations apply twice (second run skips)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node dist/infrastructure/database/migrate-cli.js
          node dist/infrastructure/database/migrate-cli.js | tee second-run.txt
          grep -q "0 succeeded, 0 failed" second-run.txt
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Resolve-all ceiling and route allowlist
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: |
          node scripts/ci-resolve-all.cjs
          node scripts/ci-routes-auth.cjs
